---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "edb-cloudnativepg-global-cluster.fullname" . }}
  labels:
    control-plane: controller-manager
    {{- include "edb-cloudnativepg-global-cluster.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      {{- include "edb-cloudnativepg-global-cluster.selectorLabels" . | nindent 6 }}
